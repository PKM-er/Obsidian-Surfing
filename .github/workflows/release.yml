name: Release Obsidian plugin

# Push a tag named exactly like the version in manifest.json (e.g. 1.0.0) to
# build, check and publish a release with the files Obsidian installs.
on:
    push:
        tags:
            - "*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Use Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22

            -   name: Tag matches manifest.json and versions.json
                run: |
                    node -e '
                    const tag = process.env.GITHUB_REF_NAME;
                    const manifest = require("./manifest.json");
                    const versions = require("./versions.json");
                    if (manifest.version !== tag) throw new Error(`manifest.json is ${manifest.version}, tag is ${tag}`);
                    if (versions[tag] !== manifest.minAppVersion) throw new Error(`versions.json has no "${tag}": "${manifest.minAppVersion}" entry`);
                    '

            -   name: Install
                env:
                    # Electron is only needed for its type definitions.
                    ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
                run: |
                    npm install --no-audit --no-fund
                    npm --prefix tools/review ci --no-audit --no-fund

            -   name: Type check, Obsidian review and tests
                run: |
                    npm run typecheck
                    npm run review -- --quiet
                    npm test

            -   name: Build
                run: npm run build

            -   name: Publish the release
                env:
                    GH_TOKEN: ${{ github.token }}
                run: |
                    tag="$GITHUB_REF_NAME"
                    notes=".github/release-notes/$tag.md"
                    if [ -f "$notes" ]; then
                        gh release create "$tag" main.js manifest.json styles.css --title "$tag" --notes-file "$notes"
                    else
                        gh release create "$tag" main.js manifest.json styles.css --title "$tag" --generate-notes
                    fi
